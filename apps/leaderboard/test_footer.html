<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wrap: 1140px;
    --panel-2: #171331;
    --line: rgba(150, 120, 220, 0.30);
    --line-2: rgba(150, 120, 220, 0.45);
    --ink: #f3f0ff;
    --ink-soft: #b7b2d4;
    --ink-mute: #9590b0;
    --accent: #c8ff00;
  }
  body {
    background: #06040c;
    color: var(--ink);
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 20px;
  }

/* --- ultra premium leaderboard footer --- */
.ftr-premium {
  position: relative;
  margin: 100px auto 0;
  max-width: var(--wrap, 1140px);
  padding: 0 20px 40px;
  z-index: 10;
}
.ftr-premium-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent, #c8ff00) 15%, transparent) 0%, transparent 70%), var(--panel-2, #141417);
  border: 1px solid var(--line, rgba(255,255,255,0.06));
  border-bottom: none;
  border-radius: 32px 32px 0 0;
  z-index: -1;
  overflow: hidden;
  backdrop-filter: blur(12px);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
}
.ftr-premium-bg::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent, #c8ff00), transparent);
  opacity: 0.8;
  box-shadow: 0 2px 20px var(--accent, #c8ff00);
}
.ftr-premium-inner {
  padding: 60px 40px 20px;
}
.ftr-premium-main {
  display: flex;
  justify-content: space-between;
  gap: 60px;
  flex-wrap: wrap;
  margin-bottom: 50px;
}
.ftr-premium-brand {
  flex: 1 1 340px;
  max-width: 500px;
}
.ftr-premium-logo {
  font-family: 'Space Grotesk', 'Sora', system-ui, sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--ink, #fff);
  margin-bottom: 8px;
  background: linear-gradient(135deg, #fff 0%, var(--ink-soft, #9a94b8) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ftr-premium-tagline {
  font-size: 15px;
  color: var(--ink-soft, #b7add6);
  margin: 0 0 24px;
  font-weight: 500;
}
.ftr-premium-disclaimer {
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-mute, #7d749b);
  margin: 0;
}
.ftr-premium-links-group {
  display: flex;
  gap: 80px;
  flex-wrap: wrap;
}
.ftr-premium-col {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.ftr-premium-col-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink, #fff);
}
.ftr-premium-links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ftr-premium-links a {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft, #b7add6);
  text-decoration: none;
  transition: all 0.25s ease;
  position: relative;
  display: inline-block;
  padding-left: 0;
}
.ftr-premium-links a::before {
  content: "→";
  position: absolute;
  left: -20px;
  opacity: 0;
  color: var(--accent, #c8ff00);
  transition: all 0.25s ease;
  font-family: system-ui;
}
.ftr-premium-links a:hover {
  color: var(--ink, #fff);
  padding-left: 12px;
}
.ftr-premium-links a:hover::before {
  opacity: 1;
  left: -4px;
}
.ftr-premium-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 30px;
}
.ftr-premium-copy {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--ink-mute, #7d749b);
  margin: 0;
}
@media (max-width: 768px) {
  .ftr-premium-inner { padding: 40px 20px 20px; }
  .ftr-premium-main { gap: 40px; }
  .ftr-premium-links-group { gap: 40px; flex-direction: column; }
  .ftr-premium-bottom { flex-direction: column; gap: 20px; text-align: center; }
}

</style>
</head>
<body>
  
<footer class="ftr-premium">
  <div class="ftr-premium-bg"></div>
  <div class="ftr-premium-inner">
    <div class="ftr-premium-main">
      <div class="ftr-premium-brand">
        <div class="ftr-premium-logo" data-brand-name>YourRank</div>
        <p class="ftr-premium-tagline" data-tagline>The premier leaderboard platform</p>
        <p class="ftr-premium-disclaimer">Disclaimer text goes here. This is a generic disclaimer for the footer to make it look realistic.</p>
      </div>
      <div class="ftr-premium-links-group">
        <div class="ftr-premium-col">
          <span class="ftr-premium-col-title">Legal &amp; Policy</span>
          <div class="ftr-premium-links">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Cookie Policy</a>
            <a href="#">Refund Policy</a>
          </div>
        </div>
        <div class="ftr-premium-col">
          <span class="ftr-premium-col-title">Support</span>
          <div class="ftr-premium-links">
            <a href="#">Contact Us</a>
            <a href="#">Responsible Gaming</a>
          </div>
        </div>
      </div>
    </div>
    <div class="ftr-premium-bottom">
      <p class="ftr-premium-copy">© <span data-year>2026</span> <span data-brand-name>YourRank</span>. All rights reserved.</p>
    </div>
  </div>
</footer>
</body>
</html>
